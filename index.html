<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Riverside Knowledge Hub: a lightweight knowledge management system that demonstrates the full KM cycle.">
  <meta name="theme-color" content="#0a0a14">
  <title>Riverside Knowledge Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235b3df5'/%3E%3Ccircle cx='72' cy='28' r='12' fill='%23c6f432'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="app">
    <aside id="side" aria-label="Main navigation"></aside>
    <div class="mainc">
      <header id="topbar">
        <input id="q" type="search" placeholder="Search pages, tags and guides…  (press / )" aria-label="Search the Hub" autocomplete="off">
        <button class="btn" id="newb" data-a="new" type="button">+ New page</button>
        <button class="btn ghost icon" id="themeb" data-a="theme" type="button" aria-label="Toggle colour theme">Theme</button>
      </header>
      <main id="view" tabindex="-1"><p class="empty">Loading the Hub…</p></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="imp" accept="application/json,.json" hidden>

  <script src="assets/js/sample.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/permissions.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
